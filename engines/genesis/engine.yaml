# Genesis engine plugin. Contract: docs/EXTENDING.md and harness/gates/engine.yaml.
id: genesis
label: "Genesis 1.4.5 (own rigid solver, CPU or GPU): Panda, cathlab table scene"
env: {kind: venv, name: ~/venvs/genesis}
worker: genesis
embodiments: [panda]
io: panda_libero
variation: configs/variation/cathlab_v1.yaml
task: configs/tasks/cathlab_pick.yaml
capabilities:                    # ready | in_progress | planned
  preview: ready
  objects: {primitive: ready, mjcf: planned}
  randomize: ready
  expert: {analytic: ready, graspgen: planned}
  generate: ready                # 383/384 paired train configs (+ Genesis camera/light axes) -> pick_genesis@v1
  convert: ready                 # scripts/npz_to_lerobot.py in the lerobot env
  eval: ready                    # expert 60/60 on suite_v2
  rollout: ready
entry: engines.genesis.cli
backend: "sim.genesis.backend:GenesisBackend"
credits:
  - {name: Genesis, url: "https://github.com/Genesis-Embodied-AI/Genesis", license: Apache-2.0}
  - {name: MuJoCo Menagerie Franka Panda, url: "https://github.com/google-deepmind/mujoco_menagerie/tree/main/franka_emika_panda", license: Apache-2.0}
