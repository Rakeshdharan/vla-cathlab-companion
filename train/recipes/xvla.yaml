# X-VLA fine-tuned from xvla-base, auto action mode (xvla_panda_pick_v1, xvla_panda_genesis_v1, xvla_panda_pick_v2;
# xvla_panda_maniskill_v1 with --steps 2500; xvla_fr3_pick_v1 with --steps 3500 on the fr3_duo_16d cameras).
model: xvla
policy:
  path: lerobot/xvla-base
  dtype: bfloat16
  action_mode: auto
  max_action_dim: 20
  freeze_vision_encoder: false
  freeze_language_encoder: false
  train_policy_transformer: true
  train_soft_prompts: true
rename:
  panda_libero: {observation.images.agentview: observation.images.image, observation.images.eye_in_hand: observation.images.image2}
  fr3_duo_16d: {observation.images.external_camera: observation.images.image, observation.images.left_wrist_camera: observation.images.image2, observation.images.right_wrist_camera: observation.images.image3}
train: {batch_size: 32, steps: 7500, save_freq: 2500, log_freq: 20, num_workers: 16}
