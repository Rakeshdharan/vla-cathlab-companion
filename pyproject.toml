[project]
name = "cathlab-companion"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "numpy", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
train = ["lerobot", "wandb"]
voice = ["elevenlabs"]
eval = ["wandb", "pillow", "matplotlib", "pandas", "scipy"]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E9", "F", "W291", "W293"]
