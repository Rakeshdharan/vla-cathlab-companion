id: eval
title: Evaluation
status: partial
owner: "Rakesh (engine eval stages), Akanksh (metrics, VLM judge)"
extension_point: "eval/ (metrics, judge, failure analysis) and each engine's eval stage; suites in configs/eval/"
contract:
